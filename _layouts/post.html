---
layout: default
---

<article class="pt-32 pb-20 relative overflow-hidden min-h-screen">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        
        <!-- Post Header -->
        <header class="mb-10 text-center">
            <div class="mb-4 text-cyanGlow text-sm font-bold font-mono">
                <i class="fa-regular fa-calendar ml-1"></i> {{ page.date | date: "%Y/%m/%d" }}
            </div>
            <h1 class="text-3xl md:text-5xl font-black text-gray-900 dark:text-white mb-6 leading-tight">{{ page.title }}</h1>
            
            {% if page.category %}
            <span class="inline-block bg-gray-100 dark:bg-navyCard text-gray-600 dark:text-gray-300 text-xs px-3 py-1 rounded-full border border-gray-200 dark:border-white/10">
                {{ page.category }}
            </span>
            {% endif %}
        </header>

        <!-- Post Cover Image (اگر در فایل مقاله عکس تعریف شده باشد) -->
        {% if page.image %}
        <div class="mb-10 rounded-3xl overflow-hidden shadow-2xl border border-gray-200 dark:border-white/10">
            <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="w-full h-auto object-cover max-h-[600px]">
        </div>
        {% endif %}

        <!-- Post Content -->
        <div class="glass-panel bg-white dark:bg-navyDark/80 p-6 md:p-10 rounded-3xl border border-gray-200 dark:border-white/10 shadow-xl">
            <!-- Content -->
            <div class="text-gray-700 dark:text-gray-300 leading-loose space-y-6 text-base md:text-lg">
                {{ content }}
            </div>
        </div>
        
        <!-- Back Button -->
        <div class="mt-12 text-center">
            <a href="{{ '/blog.html' | relative_url }}" class="inline-flex items-center justify-center px-6 py-3 rounded-xl bg-gray-100 dark:bg-navyCard text-gray-700 dark:text-gray-300 hover:text-cyanGlow dark:hover:text-cyanGlow border border-gray-200 dark:border-white/10 transition-colors font-bold text-sm">
                <i class="fa-solid fa-arrow-right ml-2"></i> بازگشت به وبلاگ
            </a>
        </div>
    </div>
</article>
